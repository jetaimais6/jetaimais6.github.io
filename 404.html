<!-- 与其它页面一致：先应用已保存的主题，避免闪烁 -->
<script>
  (function () {
    try {
      var q = (location.search.match(/[?&]theme=(light|dark)\b/) || [])[1];
      if (q) {
        localStorage.setItem('theme', q);
        document.documentElement.setAttribute('data-theme', q);
        return;
      }
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
